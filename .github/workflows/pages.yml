name: pages

# github-pages/ の中身だけを GitHub Pages で配信する(https://stract-inc.github.io/aclab-demos/<slug>/...)。
# デモが HTTPS で配布したいファイル(UCP のエージェントプロフィールなど)の置き場所。
# ディレクトリ名は配布の手段。ほかの配布先が増えたら、同じ階層に手段名のディレクトリを足す。
# リポジトリ全体を Pages に載せないのは、各デモのソースコードを
# ブラウザが実行できる形で会社名のドメイン配下に置かないため。
on:
  push:
    branches: [main]
    paths: ["github-pages/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
      - id: deploy
        uses: actions/deploy-pages@v4
